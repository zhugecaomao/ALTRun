name: Feature request / 功能建议
description: Suggest a new feature or an improvement / 建议一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决什么问题
      description: What is inconvenient now, and when would you use it? / 现在哪里不方便? 在什么场景下会用到?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议的做法
      description: What should ALTRun do? If Alfred or another launcher has something similar, add a link or screenshot / 希望 ALTRun 怎么做? 如果 Alfred 或其它启动器有类似功能, 可以附上链接或截图
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其它方案
      description: How do you work around it now? / 现在是怎么绕过这个问题的?
