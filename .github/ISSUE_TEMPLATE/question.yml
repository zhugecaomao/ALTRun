name: Question / 使用问题
description: Ask how to use ALTRun or understand a feature / 咨询 ALTRun 的使用方法或功能
body:
  - type: markdown
    attributes:
      value: |
        Please check the [FAQ](https://github.com/zhugecaomao/ALTRun/wiki/FAQ) and [documentation](https://github.com/zhugecaomao/ALTRun/wiki) first.
        请先查看[常见问题](https://github.com/zhugecaomao/ALTRun/wiki/FAQ-zh)和[使用文档](https://github.com/zhugecaomao/ALTRun/wiki)。
  - type: textarea
    id: question
    attributes:
      label: Question / 问题
      description: What would you like to know? / 你想了解什么?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ALTRun version / ALTRun 版本
      description: If relevant, type "about" in the search box and open "About ALTRun" / 如有需要，在搜索框输入 "about" 并打开 "关于 ALTRun"
      placeholder: "2026.11.21"
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      placeholder: "Windows 11 25H2"
  - type: textarea
    id: context
    attributes:
      label: Additional context / 其它背景
      description: Include relevant details or screenshots, but remove private information / 可补充相关信息或截图，请先删除隐私内容
