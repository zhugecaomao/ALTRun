name: Question / 使用问题
description: Ask a question or discuss how to use ALTRun / 提问或讨论 ALTRun 的使用问题
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Before asking, please check the [Wiki](https://github.com/zhugecaomao/ALTRun/wiki) and [FAQ](https://github.com/zhugecaomao/ALTRun/wiki/FAQ).
        提问前，请先查阅 [Wiki](https://github.com/zhugecaomao/ALTRun/wiki) 和 [常见问题](https://github.com/zhugecaomao/ALTRun/wiki/FAQ)。

  - type: textarea
    id: question
    attributes:
      label: Question / 问题
      description: Describe your question or the topic you would like to discuss. / 请描述你的问题或希望讨论的内容。
      placeholder: What would you like to know? / 你想了解或讨论什么？
    validations:
      required: true

  - type: input
    id: altrun-version
    attributes:
      label: ALTRun version / ALTRun 版本
      placeholder: e.g. 2026.11.21

  - type: input
    id: windows-version
    attributes:
      label: Windows version / Windows 版本
      placeholder: e.g. Windows 11 25H2

  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Add any details that may help clarify your question. / 补充有助于理解问题的信息。
