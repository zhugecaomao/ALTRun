# Syncs the main branch and all tags to the Gitee mirror, for faster access / cloning in China.
# First add in the repository's Settings -> Secrets and variables -> Actions:
#   GITEE_SSH_KEY   (Secret)   the private key; add the matching public key under Gitee's Personal settings -> SSH keys (https://gitee.com/profile/sshkeys)
#                              (Gitee's repository deploy keys are read-only and can't push)
#   GITEE_REPO      (Variable) optional, user/repository on Gitee, default zhugecaomao/ALTRun
# Does nothing without GITEE_SSH_KEY.
# Commits and tags the release workflow pushes with GITHUB_TOKEN don't trigger other workflows, so it also syncs once a day on a schedule.
name: Sync to Gitee

on:
  push:
    branches: [main]
    tags: ["*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
      GITEE_REPO: ${{ vars.GITEE_REPO || 'zhugecaomao/ALTRun' }}
    steps:
      - name: Check secret
        if: env.GITEE_SSH_KEY == ''
        run: echo "GITEE_SSH_KEY is not set, skipping."

      - uses: actions/checkout@v7
        if: env.GITEE_SSH_KEY != ''
        with:
          fetch-depth: 0

      - name: Push main and tags to Gitee
        if: env.GITEE_SSH_KEY != ''
        timeout-minutes: 30
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/gitee
          chmod 600 ~/.ssh/gitee
          ssh-keyscan -t ed25519,rsa gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          # Connections from GitHub's machines to Gitee sometimes drop (Connection reset): keep the connection alive and retry each failed push a few times
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gitee -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          remote="git@gitee.com:${GITEE_REPO}.git"
          retry() {
            for attempt in 1 2 3 4; do
              "$@" && return 0
              echo "Attempt $attempt failed, retrying in $((attempt * 15)) s..."
              sleep $((attempt * 15))
            done
            return 1
          }
          git fetch --tags origin
          retry git push --force "$remote" "refs/remotes/origin/main:refs/heads/main"
          # tags are pushed one by one, only those missing on Gitee or pointing to a different commit; pushing too many at once tends to disconnect
          retry git ls-remote --tags "$remote" > remote-tags.txt
          failed=0
          for tag in $(git tag --sort=creatordate); do
            if ! grep -q "^$(git rev-parse "refs/tags/$tag")[[:space:]]refs/tags/$tag$" remote-tags.txt; then
              echo "Pushing tag $tag"
              retry git push --force "$remote" "refs/tags/$tag:refs/tags/$tag" || failed=1
            fi
          done
          exit $failed
