# Automatic switching to a file dialog on a real Windows desktop (Tests\Integration\QuickSwitchCheck.ahk): Explorer at a folder,
# an Open dialog, then switching from Explorer to the dialog (activate, Alt+Tab, a click on the title bar) must make the dialog
# jump to Explorer's folder. On pull requests that change Quick Switch, on main, every Monday (a new runner image can change how
# windows come to the front without any change here), or run by hand
name: Quick Switch

on:
  pull_request:
    paths:
      - Src/Extensions/QuickSwitch.ahk
      - Src/Extensions/QuickSwitchPanel.ahk
      - Src/Extensions/QuickSwitchFavorites.ahk
      - Src/Extensions/FileDialogs.ahk
      - Src/Extensions/FileManagers.ahk
      - Tests/Integration/QuickSwitchCheck.ahk
      - Src/Extensions/AdminHelper.ahk
      - Tests/Integration/AdminDialogCheck.ahk
      - .github/workflows/quickswitch.yml
      - .github/actions/setup-ahk/**
  push:
    branches: [main]
    paths:
      - Src/Extensions/QuickSwitch.ahk
      - Src/Extensions/QuickSwitchPanel.ahk
      - Src/Extensions/QuickSwitchFavorites.ahk
      - Src/Extensions/FileDialogs.ahk
      - Src/Extensions/FileManagers.ahk
      - Tests/Integration/QuickSwitchCheck.ahk
      - Src/Extensions/AdminHelper.ahk
      - Tests/Integration/AdminDialogCheck.ahk
      - .github/workflows/quickswitch.yml
      - .github/actions/setup-ahk/**
  schedule:
    - cron: '41 1 * * 1'                                                  # Mondays 01:41 UTC
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds for each way of switching"
        type: number
        default: 5

permissions:
  contents: read

concurrency:                                                            # a new commit on a PR stops the run for the old one; on main every commit keeps its run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2                                      # pinned, the same as the release build (.github/actions/setup-ahk)
        uses: ./.github/actions/setup-ahk

      - name: Switch to a dialog
        shell: pwsh
        run: |
          # A copy of its own: the check writes the copy's Data\ALTRun.json
          $app = "C:\QuickSwitchCheck\app"
          New-Item -ItemType Directory $app -Force | Out-Null
          Copy-Item ALTRun.ahk, Lib, Src, Resources -Destination $app -Recurse
          $rounds = "${{ inputs.rounds }}"
          if (-not $rounds) { $rounds = 5 }
          $proc = Start-Process tools/ahk/AutoHotkey64.exe -ArgumentList '/ErrorStdOut', 'Tests\Integration\QuickSwitchCheck.ahk', "`"$app`"", $rounds `
                  -PassThru -NoNewWindow -RedirectStandardOutput check.log -RedirectStandardError check.err
          if (-not $proc.WaitForExit(600000)) { $proc.Kill(); Get-Content check.log, check.err -ErrorAction SilentlyContinue; throw "The check didn't finish in 10 minutes" }
          Get-Content check.log, check.err -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "$($proc.ExitCode) round(s) failed" }

      - name: A dialog of a program running as administrator                # the ALTRun side as a standard user (medium integrity), the dialog and the helper as administrator
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # A copy the test user can read, outside the runner's work folder
          $root = "C:\Users\Public\altrun-admin-check"
          New-Item -ItemType Directory $root -Force | Out-Null
          Copy-Item ALTRun.ahk, Lib, Src, Resources, Tests, tools -Destination $root -Recurse -Force
          $name = "altrunqs"
          $password = "Aa1!" + [guid]::NewGuid().ToString("N").Substring(0, 10)   # a throwaway account on a throwaway runner; at most 14 characters
          net user $name $password /add
          if ($LASTEXITCODE -ne 0) { throw "could not create the test user" }
          $proc = Start-Process "$root\tools\ahk\AutoHotkey64.exe" -WorkingDirectory "$root\Tests" `
                  -ArgumentList '/ErrorStdOut', 'RunTests.ahk', 'AdminDialogCheck', 'admin', "`"$root`"", "`"$root\Tests`"", $name, $password `
                  -PassThru -NoNewWindow -RedirectStandardOutput admin-check.log -RedirectStandardError admin-check.err
          if (-not $proc.WaitForExit(300000)) { $proc.Kill(); Get-Content admin-check.log, admin-check.err -ErrorAction SilentlyContinue; throw "The check didn't finish in 5 minutes" }
          Get-Content admin-check.log, admin-check.err -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "$($proc.ExitCode) check(s) failed" }
