# Packages a release of ALTRun: compiles ALTRun.exe on Windows, runs the unit tests (only when publishing: a test build's commit is
# tested by the Tests workflow at the same time, and signing waits for nothing), verifies upgrading from an old ALTRun.ini,
# packs ALTRun_v<version>.zip; with publish = true it also creates the GitHub Release (tag = version).
#
# Release steps:
#   1. update App.Version in Src\Core\App.ahk and ;@Ahk2Exe-SetVersion in ALTRun.ahk (a test checks they match)
#   2. add a section "## [<version>] ..." to CHANGELOG.md, used as the release notes
#   3. merging the PR to main builds it by itself (publish = false: the "push" trigger below, only when App.Version changed);
#      to release, run "Release" on the Actions page on main with publish = true
# A test build on a PR branch before merging: run "Release" on that branch with publish = false.
# After publishing, the Scoop (bucket/altrun.json) and winget (packaging/winget) manifests are updated to the new version and committed to main;
# with the WINGET_TOKEN secret (a GitHub token with public_repo scope) wingetcreate also submits the new version to winget-pkgs.
name: Release
run-name: ${{ inputs.publish && 'Publish release' || 'Test build' }}

on:
  # A merged PR that changes Src/Core/App.ahk; the "version" job builds only when the App.Version line itself changed.
  # Building after the merge (not on the PR branch) also avoids signing failures: SignPath fetches the branch, which is deleted on merge.
  push:
    branches: [main]
    paths: [Src/Core/App.ahk]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release (false = build and test only)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read                   # SignPath reads this build and downloads the artifacts to sign with GITHUB_TOKEN

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - name: Did App.Version change?
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git cat-file -e "$BEFORE" 2>/dev/null || git fetch -q --depth=1 origin "$BEFORE"
          if git diff "$BEFORE" HEAD -- Src/Core/App.ahk | grep -qE '^\+\s*static Version\s*:='; then changed=true; else changed=false; fi
          echo "App.Version changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45                                    # a normal run takes under 10 minutes; the unit tests have their own limit (Tests/Tools/RunAhk.ps1)
    env:
      GH_TOKEN: ${{ github.token }}
      # only whether the secrets are set; each secret goes to the one step that uses it, not to every step of the job
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      HAS_WINGET: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      # Git on Windows converts text files from LF to CRLF by default (core.autocrlf), so the README, LICENSE and JSON in the package
      # would differ byte for byte from the repository / source ZIP. Turn the conversion off so the package's files match the repository exactly
      - name: Keep line endings as in the repository
        run: git config --global core.autocrlf false

      # Publishing must use the exact main branch; dry-run builds may use any branch.
      - name: Validate publish ref
        if: inputs.publish
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Publishing is only allowed from main (current ref: $env:GITHUB_REF)"
          }

      - uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Src/Core/App.ahk -Pattern 'static Version\s*:=\s*"([0-9.]+)"'
          if (-not $match) { throw "App.Version not found in Src/Core/App.ahk" }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          # A formal version (YYYY.MM.DD, as on a release PR and when publishing) also builds and tests the Microsoft Store package
          $formal = if ($version -match '^\d{4}\.\d{2}\.\d{2}$') { 'true' } else { 'false' }
          Write-Host "Formal version (MSIX package): $formal"
          "formal=$formal" >> $env:GITHUB_OUTPUT
          if ("${{ inputs.publish }}" -eq "true") {
            if ($version -notmatch '^\d{4}\.\d{2}\.\d{2}$') {
              throw "Formal release version must have three parts (YYYY.MM.DD); found $version"
            }
            gh release view $version --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) { throw "Release $version already exists - bump App.Version first" }
            $global:LASTEXITCODE = 0
          }

      - name: Download AutoHotkey v2 and Ahk2Exe                          # pinned versions, SHA256 checked (.github/actions/setup-ahk)
        uses: ./.github/actions/setup-ahk
        with:
          ahk2exe: true

      - name: Unit tests
        if: ${{ inputs.publish }}                                          # a test build (publish = false): the Tests workflow tests the same commit
        shell: pwsh
        run: |
          & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', 'Tests\RunTests.ahk' `
            -Out test.log -Err test.err -TimeoutSeconds 600                 # about 70 s on GitHub's runners
          $code = $LASTEXITCODE
          Get-Content test.log | Where-Object { $_ -notmatch '^PASS' }
          Get-Content test.log | Where-Object { $_ -match '^(FAIL|UNCAUGHT)' } | ForEach-Object { Write-Host "::error::$_" }   # failed tests show in the annotations of the check results
          Get-Content test.err
          if ($code -ne 0) { throw "Unit tests failed (exit code $code)" }

      - name: Compile ALTRun.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/ALTRun -Force | Out-Null
          $ahk2exe = (Get-ChildItem -Recurse tools/ahk2exe -Filter Ahk2Exe.exe)[0].FullName
          $proc = Start-Process $ahk2exe -Wait -PassThru -NoNewWindow -ArgumentList `
                  '/in', "$PWD\ALTRun.ahk", '/out', "$PWD\build\ALTRun\ALTRun.exe", '/base', "$PWD\tools\ahk\AutoHotkey64.exe", '/silent', 'verbose'
          if ($proc.ExitCode -ne 0 -or -not (Test-Path build/ALTRun/ALTRun.exe)) { throw "Compile failed (exit code $($proc.ExitCode))" }
          Copy-Item -Recurse Resources build/ALTRun/Resources
          foreach ($lang in "zh-CN", "zh-TW", "ja") {
            if (-not (Test-Path "build/ALTRun/Resources/Lang/$lang.json")) { throw "Resources\Lang\$lang.json is missing" }
          }
          Copy-Item LICENSE, README.md, README.zh-CN.md, CHANGELOG.md build/ALTRun/
          foreach ($file in @("LICENSE", "README.md", "README.zh-CN.md", "CHANGELOG.md") + (git ls-files Resources)) {   # byte for byte identical to the repository (line endings not converted)
            if ((git hash-object --no-filters "build/ALTRun/$file") -ne (git rev-parse "HEAD:$file")) { throw "$file in the package differs from the repository" }
          }
          (Get-Item build/ALTRun/ALTRun.exe).VersionInfo | Format-List FileVersion, ProductName, FileDescription

      # Code signing (SignPath Foundation signs open source projects for free, see packaging/README.md): signs automatically once the SIGNPATH_API_TOKEN secret
      # and the SIGNPATH_ORGANIZATION_ID variable are set; skipped without them, and the unsigned version is released as usual.
      # publish = false uses the test certificate (test-signing); publish = true the release certificate (release-signing), which only signs after the release certificate is imported
      # and the variable SIGNPATH_RELEASE_SIGNING is set to true; until then releases go out unsigned as usual
      - name: Upload unsigned ALTRun.exe for signing
        id: unsigned
        if: env.HAS_SIGNPATH == 'true' && (!inputs.publish || vars.SIGNPATH_RELEASE_SIGNING == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ALTRun-unsigned
          path: build/ALTRun/ALTRun.exe

      - name: Sign ALTRun.exe (SignPath)
        if: env.HAS_SIGNPATH == 'true' && (!inputs.publish || vars.SIGNPATH_RELEASE_SIGNING == 'true')
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092   # v3.0, pinned to its commit
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ALTRun
          signing-policy-slug: ${{ inputs.publish && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800        # release signing must be approved on the SignPath website
          output-artifact-directory: build/signed

      - name: Use the signed ALTRun.exe
        if: env.HAS_SIGNPATH == 'true' && (!inputs.publish || vars.SIGNPATH_RELEASE_SIGNING == 'true')
        shell: pwsh
        run: |
          Copy-Item build/signed/ALTRun.exe build/ALTRun/ALTRun.exe -Force
          $sig = Get-AuthenticodeSignature build/ALTRun/ALTRun.exe
          Write-Host "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ("${{ inputs.publish }}" -eq "true" -and $sig.Status -ne 'Valid') { throw "ALTRun.exe is not signed with a trusted certificate" }

      # the exe's icon must be Resources\ALTRun.ico (;@Ahk2Exe-SetMainIcon), not AutoHotkey's default green H
      - name: Check program icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\build\ALTRun\ALTRun.exe").ToBitmap()
          $ico = (New-Object System.Drawing.Icon("$PWD\Resources\ALTRun.ico", $exe.Width, $exe.Height)).ToBitmap()
          $diff = 0
          for ($y = 0; $y -lt $exe.Height; $y++) { for ($x = 0; $x -lt $exe.Width; $x++) {
            if ($exe.GetPixel($x, $y).ToArgb() -ne $ico.GetPixel($x, $y).ToArgb()) { $diff++ } } }
          Write-Host "Icon $($exe.Width)x$($exe.Height): $diff different pixels"
          if ($diff -gt 0) { throw "ALTRun.exe does not use Resources\ALTRun.ico" }

      # Simulates a user upgrading from v2026.08.12: only the old ALTRun.ini in the folder, the first run after extracting the new version
      - name: Upgrade test (ALTRun.ini from v2026.08.12)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "upgrade"
          New-Item -ItemType Directory $dir -Force | Out-Null
          Copy-Item build/ALTRun/* $dir -Recurse
          Copy-Item Tests/Fixtures/ALTRun.v2026.08.12.ini (Join-Path $dir "ALTRun.ini")
          $iniHash = (Get-FileHash (Join-Path $dir "ALTRun.ini")).Hash
          $started = Get-Date
          $proc = Start-Process (Join-Path $dir "ALTRun.exe") -WorkingDirectory $dir -PassThru
          $json = Join-Path $dir "Data\ALTRun.json"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $json); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          $running = -not $proc.HasExited
          if (-not $running) {
            # During the 2026.09.24 release ALTRun.exe once exited by itself and didn't happen again in 12 runs; leave clues if it recurs
            Write-Host "ALTRun.exe exited after $(((Get-Date) - $started).TotalSeconds.ToString('N1'))s, exit code $($proc.ExitCode)"
            # who started the other ALTRun process: /restart on the command line means ALTRun restarted itself, otherwise look at the parent process
            Get-CimInstance Win32_Process -Filter "Name = 'ALTRun.exe'" -ErrorAction SilentlyContinue | ForEach-Object {
              $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($_.ParentProcessId)" -ErrorAction SilentlyContinue
              Write-Host "Other ALTRun process: $($_.ProcessId) started $($_.CreationDate.ToString('HH:mm:ss.fff')), command line: $($_.CommandLine)"
              Write-Host "  parent: $($_.ParentProcessId) $($parent.Name) $($parent.CommandLine)"
            }
            Get-ChildItem $dir -Recurse -Name | ForEach-Object { Write-Host "  file: $_" }
            Get-WinEvent -FilterHashtable @{LogName = 'Application'; StartTime = $started} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'ALTRun|AutoHotkey' } | Select-Object -First 5 |
              ForEach-Object { Write-Host "  event $($_.Id) $($_.ProviderName): $($_.Message)" }
            $log = Join-Path $env:TEMP "ALTRun.log"
            if (Test-Path $log) { Get-Content $log -Tail 30 | ForEach-Object { Write-Host "  log: $_" } }
          }
          Get-Process -Name ALTRun -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $json)) { throw "Data\ALTRun.json was not created" }
          $settings = Get-Content $json -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "Running: $running; SchemaVersion: $($settings.SchemaVersion); commands: $($settings.CustomCommands.Count); language: $($settings.General.Language)"
          if (-not $running) { throw "ALTRun.exe exited on its own" }
          if ($settings.SchemaVersion -lt 4) { throw "Settings were not upgraded" }
          if ($settings.CustomCommands.Count -ne 10) { throw "Expected 10 imported commands" }
          if ($settings.General.Language -ne "zh-CN") { throw "Config section was not imported" }
          if ((Get-FileHash (Join-Path $dir "ALTRun.ini")).Hash -ne $iniHash) { throw "ALTRun.ini was modified" }

      - name: Single instance test (compiled ALTRun.exe)
        shell: pwsh
        run: |
          # Starting ALTRun.exe while it already runs: handed to the running one (double-click = show the search window, Send to = add commands), no second instance
          $dir = Join-Path $env:RUNNER_TEMP "single"
          New-Item -ItemType Directory $dir -Force | Out-Null
          Copy-Item build/ALTRun/* $dir -Recurse
          $exe = Join-Path $dir "ALTRun.exe"
          $json = Join-Path $dir "Data\ALTRun.json"
          $first = Start-Process $exe -ArgumentList '-Startup' -WorkingDirectory $dir -PassThru
          for ($i = 0; $i -lt 30 -and -not (Test-Path $json); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          # the main window's title (used to find the running ALTRun), kept in the log
          $probe = Join-Path $env:RUNNER_TEMP "titles.ahk"
          'DetectHiddenWindows(true)', 'for hwnd in WinGetList("ahk_class AutoHotkey")', '    FileAppend(WinGetTitle(hwnd) "`n", "*")' | Set-Content $probe -Encoding UTF8
          $out = Join-Path $env:RUNNER_TEMP "titles.txt"
          Start-Process tools/ahk/AutoHotkey64.exe -ArgumentList '/ErrorStdOut', $probe -Wait -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out | ForEach-Object { Write-Host "AutoHotkey window: $_" }
          $before = (Get-Content $json -Raw -Encoding UTF8 | ConvertFrom-Json).CustomCommands.Count
          New-Item -ItemType Directory (Join-Path $dir "SendTo A") -Force | Out-Null
          Set-Content (Join-Path $dir "SendTo B.txt") "x"
          # it exits right after handing over; if it didn't hand over it keeps running, so wait only 10 s
          (Start-Process $exe -WorkingDirectory $dir -PassThru).WaitForExit(10000) | Out-Null
          (Start-Process $exe -ArgumentList '-SendTo', "`"$(Join-Path $dir 'SendTo A')`"", "`"$(Join-Path $dir 'SendTo B.txt')`"" -WorkingDirectory $dir -PassThru).WaitForExit(10000) | Out-Null
          Start-Sleep -Seconds 3
          $processes = @(Get-Process -Name ALTRun -ErrorAction SilentlyContinue)
          $alive = -not $first.HasExited
          $after = (Get-Content $json -Raw -Encoding UTF8 | ConvertFrom-Json).CustomCommands.Count
          Get-Process -Name ALTRun -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "ALTRun processes: $($processes.Count); first still running: $alive; commands: $before -> $after"
          if ($processes.Count -ne 1 -or -not $alive) { throw "Starting ALTRun.exe again did not hand over to the running instance" }
          if ($after -ne $before + 2) { throw "Send to did not add the commands in the running instance" }

      # The Microsoft Store package (packaging/msix): built from the same files, unsigned (the Store signs it when it publishes it).
      # Its test copy is signed with a throwaway certificate, installed, ALTRun started from it through the "altrun" alias and
      # checked; then the Windows App Certification Kit runs on it (optional tests only reported). See packaging/README.md
      # Only for a formal version: only those go to the Store, and test builds are quicker without it
      - name: MSIX package
        if: steps.version.outputs.formal == 'true'
        shell: pwsh
        run: ./packaging/msix/Make-Msix.ps1 -Source build/ALTRun -Version "${{ steps.version.outputs.version }}" -Out "build/msix/ALTRun_v${{ steps.version.outputs.version }}_x64.msix"

      - name: MSIX test (installed with a test certificate)
        if: steps.version.outputs.formal == 'true'
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP "ALTRun-test.msix"
          Copy-Item (Get-Item build/msix/*.msix).FullName $test
          $publisher = ([xml](Get-Content packaging/msix/AppxManifest.xml -Raw)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName "ALTRun MSIX test" `
                  -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $cer = Join-Path $env:RUNNER_TEMP "msix-test.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $test | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Signing the test copy failed" }
          Add-AppxPackage $test
          $package = Get-AppxPackage zhugecaomao.ALTRun
          Write-Host "Installed $($package.PackageFullName)"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\altrun.exe"
          $json = "$env:APPDATA\ALTRun\Data\ALTRun.json"
          $startup = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\ALTRun.lnk"
          Remove-Item "$env:APPDATA\ALTRun" -Recurse -Force -ErrorAction SilentlyContinue
          Start-Process $alias
          for ($i = 0; $i -lt 30 -and -not (Test-Path $json); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 4
          $process = Get-CimInstance Win32_Process -Filter "Name = 'ALTRun.exe'" | Select-Object -First 1
          $target = if (Test-Path $startup) { (New-Object -ComObject WScript.Shell).CreateShortcut($startup).TargetPath } else { "" }
          Get-Process ALTRun -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Running: $($process.ExecutablePath)"
          Write-Host "Settings in %APPDATA%\ALTRun\Data: $(Test-Path $json)"
          Write-Host "Start-up shortcut: $target"
          $failures = @()
          if (-not $process -or $process.ExecutablePath -notlike "$($package.InstallLocation)\*") { $failures += "ALTRun didn't run from the package" }
          if (-not (Test-Path $json)) { $failures += "no settings in %APPDATA%\ALTRun\Data (is write virtualization off?)" }
          if ($target -ne $alias) { $failures += "the start-up shortcut doesn't start the altrun alias" }
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (Test-Path $kit) {
            $report = Join-Path $env:RUNNER_TEMP "wack.xml"
            & $kit reset | Out-Null
            & $kit test -appxpackagepath $test -reportoutputpath $report | Out-Null
            [xml]$xml = Get-Content $report
            Write-Host "Windows App Certification Kit: $($xml.REPORT.OVERALL_RESULT)"
            foreach ($check in $xml.SelectNodes("//TEST")) {
              $result = $check.RESULT.InnerText.Trim()
              if ($result -eq 'PASS') { continue }
              Write-Host "  $result $($check.NAME)$(if ($check.OPTIONAL -eq 'TRUE') { ' (optional)' })"
              $check.SelectNodes('.//MESSAGE') | ForEach-Object { Write-Host "    $($_.TEXT)" }
              if ($result -eq 'FAIL' -and $check.OPTIONAL -ne 'TRUE') { $failures += "certification kit: $($check.NAME)" }
            }
          } else {
            Write-Host "Windows App Certification Kit not installed: skipped"
          }
          Remove-AppxPackage $package.PackageFullName
          Remove-Item "Cert:\LocalMachine\TrustedPeople\$($cert.Thumbprint)", "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          if ($failures) { throw ($failures -join "; ") }

      - name: Package
        shell: pwsh
        run: |
          $zip = "build/ALTRun_v${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path build/ALTRun/* -DestinationPath $zip
          Get-Item $zip | Format-List Name, Length

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version" }
          $notes = @()
          foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match '^## ') { break }
            $notes += $line
          }
          $previous = gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName 2>$null
          $global:LASTEXITCODE = 0
          if ($previous -and $previous -ne $version) {
            $notes += ""
            $notes += "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previous...$version"
          }
          $notes | Set-Content build/notes.md -Encoding UTF8
          Get-Content build/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: ALTRun_v${{ steps.version.outputs.version }}
          path: |
            build/ALTRun_v*.zip
            build/notes.md

      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.formal == 'true'
        with:
          name: ALTRun_v${{ steps.version.outputs.version }}_msix          # for the Microsoft Store submission (unsigned: can't be installed as it is)
          path: build/msix/*.msix

      - name: Create GitHub release
        if: inputs.publish
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create $version "build/ALTRun_v$version.zip" --repo "${{ github.repository }}" `
            --title "ALTRun - v$version" --notes-file build/notes.md --target "${{ github.sha }}"

      - name: Update Scoop and winget manifests
        if: inputs.publish
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          git fetch --quiet origin main
          git checkout -B main origin/main
          ./packaging/Update-Manifests.ps1 -Version $version -Zip "build/ALTRun_v$version.zip"
          git add bucket packaging
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Manifests are already up to date"; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Packaging: update Scoop / winget manifests to $version"
          git push origin main

      # syncs the token owner's fork of winget-pkgs first, then opens the pull request (packaging/Submit-Winget.ps1); when it fails,
      # the release stands and the "Submit to winget" workflow submits it again
      - name: Submit the new version to winget-pkgs
        if: inputs.publish && env.HAS_WINGET == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: ./packaging/Submit-Winget.ps1 -Version "${{ steps.version.outputs.version }}" -Repository "${{ github.repository }}"
