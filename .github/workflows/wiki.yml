# 把 docs/wiki/ 发布到 GitHub Wiki。
# Wiki 的内容以仓库里的 docs/wiki/ 为准 (可以通过 PR 修改和审阅); 合并到 main 后自动同步。
# 直接在网页上修改的 Wiki 会在下次同步时被覆盖, 请改 docs/wiki/。
# 2026.10.20 以前英文页叫 en-Usage、中文页叫 Usage; 现在英文页是 Usage、中文页是 Usage-zh。
# 为了旧链接和旧版本 ALTRun 里的帮助链接, 发布时另外生成一行的 en-Usage 页面指向新名字,
# 2026.10.20 之后发布满三个正式版后不再生成 (每周一也检查一次, 到时自动删掉)。
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync docs/wiki to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +   # 页面以 docs/wiki/ 为准, 删掉的页面也同步删除
          cp -r docs/wiki/. wiki/

          # 旧的 en- 页面: 2026.10.20 之后的正式版 (三段版本号) 不满三个时生成
          after=$(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' | awk '$0 > "2026.10.20"' | wc -l)
          if [ "$after" -lt 3 ]; then
            for file in docs/wiki/*.md; do
              name=$(basename "$file" .md)
              case "$name" in _*|*-zh) continue ;; esac
              printf '**This page has moved to [%s](%s).** 中文页: [%s-zh](%s-zh)\n' "$name" "$name" "$name" "$name" > "wiki/en-$name.md"
            done
            echo "Published en- redirect pages ($after release(s) since 2026.10.20)"
          else
            echo "No en- redirect pages ($after releases since 2026.10.20)"
          fi
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date"
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
