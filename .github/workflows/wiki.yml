# Publishes docs/wiki/ to the GitHub Wiki.
# The Wiki's content comes from docs/wiki/ in the repository (changed and reviewed through PRs); synced automatically after merging to main.
# Edits made directly on the Wiki website are overwritten at the next sync; change docs/wiki/ instead.
# English pages are Usage, Chinese pages Usage-zh (before 2026.10.20: en-Usage and Usage; the one-line en- redirect pages published
# for old links were dropped after three releases)
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync docs/wiki to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +   # the pages follow docs/wiki/; deleted pages are deleted too
          cp -r docs/wiki/. wiki/

          cd wiki
          # the pages come from docs/wiki/ as reviewed and merged by the maintainer: the Wiki shows the maintainer as the editor
          git config user.name "zhugecaomao"
          git config user.email "11486126+zhugecaomao@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date"
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
