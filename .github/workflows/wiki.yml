# Publishes docs/wiki/ to the GitHub Wiki.
# The Wiki's content comes from docs/wiki/ in the repository (changed and reviewed through PRs); synced automatically after merging to main.
# Edits made directly on the Wiki website are overwritten at the next sync; change docs/wiki/ instead.
# Before 2026.10.20 the English pages were called en-Usage and the Chinese pages Usage; now the English page is Usage and the Chinese Usage-zh.
# For old links and the help links in old ALTRun versions, publishing also generates one-line en-Usage pages pointing to the new names,
# no longer generated once three releases have come out after 2026.10.20 (also checked every Monday, deleted automatically then).
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync docs/wiki to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +   # the pages follow docs/wiki/; deleted pages are deleted too
          cp -r docs/wiki/. wiki/

          # the old en- pages: generated while there are fewer than three releases (three-part versions) after 2026.10.20
          after=$(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' | awk '$0 > "2026.10.20"' | wc -l)
          if [ "$after" -lt 3 ]; then
            for file in docs/wiki/*.md; do
              name=$(basename "$file" .md)
              case "$name" in _*|*-zh) continue ;; esac
              printf '**This page has moved to [%s](%s).** 中文页: [%s-zh](%s-zh)\n' "$name" "$name" "$name" "$name" > "wiki/en-$name.md"
            done
            echo "Published en- redirect pages ($after release(s) since 2026.10.20)"
          else
            echo "No en- redirect pages ($after releases since 2026.10.20)"
          fi
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date"
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
