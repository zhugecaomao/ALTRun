# The first start of a new installation asks whether to start at login (Tests\Integration\FirstRunCheck.ahk), on a Windows desktop with
# the real Startup folder: nothing is written there before the answer, No keeps it off, Yes (the default button) writes the start-up
# shortcut, and existing settings or an ALTRun.ini upgrade aren't asked. On pull requests that change it, on main, or run by hand
name: First run

on:
  pull_request:
    paths:
      - Src/Core/App.ahk
      - Src/Core/AppSettings.ahk
      - Tests/Integration/FirstRunCheck.ahk
      - .github/workflows/first-run.yml
      - .github/actions/setup-ahk/**
  push:
    branches: [main]
    paths:
      - Src/Core/App.ahk
      - Src/Core/AppSettings.ahk
      - Tests/Integration/FirstRunCheck.ahk
      - .github/workflows/first-run.yml
      - .github/actions/setup-ahk/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:                                                            # a new commit on a PR stops the run for the old one; on main every commit keeps its run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2                                      # pinned, the same as the release build (.github/actions/setup-ahk)
        uses: ./.github/actions/setup-ahk

      - name: Start a new installation
        shell: pwsh
        run: |
          # A copy of its own: the check deletes and writes the copy's Data folder
          $app = "C:\FirstRunCheck\app"
          New-Item -ItemType Directory $app -Force | Out-Null
          Copy-Item ALTRun.ahk, Lib, Src, Resources -Destination $app -Recurse
          & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', 'Tests\Integration\FirstRunCheck.ahk', "`"$app`"" `
            -Out check.log -Err check.err -TimeoutSeconds 300
          $code = $LASTEXITCODE
          Get-Content check.log, check.err -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "$code case(s) failed (exit code $code)" }
