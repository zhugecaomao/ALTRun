# Times the built-in file index (Tests\Bench\FileIndexBench.ahk) on Windows: on pull requests that change it, or run by hand on any branch
name: File index benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Src/Core/FileIndex.ahk
      - Src/Providers/FileSearchProvider.ahk
      - Src/Core/FuzzyMatcher.ahk
      - Tests/Bench/FileIndexBench.ahk

permissions:
  contents: read

concurrency:                                                            # a new commit on a PR stops the run for the old one; on main every commit keeps its run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2                                      # pinned, the same as the release build (.github/actions/setup-ahk)
        uses: ./.github/actions/setup-ahk

      - name: File index benchmark
        shell: pwsh
        run: |
          $proc = Start-Process tools/ahk/AutoHotkey64.exe -ArgumentList '/ErrorStdOut', 'Tests\RunTests.ahk', 'FileIndexBench' `
                  -PassThru -NoNewWindow -RedirectStandardOutput bench.log -RedirectStandardError bench.err
          if (-not $proc.WaitForExit(900000)) { $proc.Kill(); throw "The benchmark didn't finish in 15 minutes" }
          Get-Content bench.log, bench.err
          Get-Content bench.log | ForEach-Object { "- $_" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($proc.ExitCode -ne 0) { throw "The benchmark failed (exit code $($proc.ExitCode))" }
