# Delayed start against the real Windows Task Scheduler (Tests\Integration\DelayedStartCheck.ahk): as a new standard user,
# which is what matters (schtasks /SC ONLOGON needs an administrator; the COM interface ALTRun uses doesn't), then as the
# administrator the runner is. On pull requests that change it, on main, or run by hand
name: Delayed start

on:
  pull_request:
    paths:
      - Lib/TaskScheduler.ahk
      - Src/Extensions/DelayedStart.ahk
      - Tests/Integration/DelayedStartCheck.ahk
      - Src/Extensions/CapsLockHelper.ahk
      - .github/workflows/delayed-start.yml
      - .github/actions/setup-ahk/**
  push:
    branches: [main]
    paths:
      - Lib/TaskScheduler.ahk
      - Src/Extensions/DelayedStart.ahk
      - Tests/Integration/DelayedStartCheck.ahk
      - Src/Extensions/CapsLockHelper.ahk
      - .github/workflows/delayed-start.yml
      - .github/actions/setup-ahk/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:                                                            # a new commit on a PR stops the run for the old one; on main every commit keeps its run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2                                      # pinned, the same as the release build (.github/actions/setup-ahk)
        uses: ./.github/actions/setup-ahk

      - name: As a standard user
        shell: pwsh
        run: |
          # A copy the test user can read, outside the runner's work folder
          $root = "C:\Users\Public\altrun-check"
          New-Item -ItemType Directory $root -Force | Out-Null
          Copy-Item Lib, Src, Resources, Tests, tools -Destination $root -Recurse
          $name = "altruncheck"
          $password = "Aa1!" + [guid]::NewGuid().ToString("N").Substring(0, 10)   # a throwaway account on a throwaway runner; at most 14 characters, or net user asks to confirm
          net user $name $password /add
          if ($LASTEXITCODE -ne 0) { throw "could not create the test user" }
          $credential = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$name", (ConvertTo-SecureString $password -AsPlainText -Force))
          # A process started with other credentials inherits this environment: TEMP would be the administrator's (no access)
          $env:TEMP = $env:TMP = "$root\temp"
          New-Item -ItemType Directory $env:TEMP -Force | Out-Null
          icacls $env:TEMP /grant "${name}:(OI)(CI)M" | Out-Null
          $proc = Start-Process "$root\tools\ahk\AutoHotkey64.exe" -Credential $credential -LoadUserProfile -WorkingDirectory $root `
                  -ArgumentList '/ErrorStdOut', 'Tests\RunTests.ahk', 'DelayedStartCheck' `
                  -PassThru -RedirectStandardOutput "$root\check.log" -RedirectStandardError "$root\check.err"
          if (-not $proc.WaitForExit(300000)) { $proc.Kill(); throw "The check didn't finish in 5 minutes" }
          Get-Content "$root\check.log", "$root\check.err" -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "$($proc.ExitCode) check(s) failed" }

      - name: As the administrator
        shell: pwsh
        run: |
          $proc = Start-Process tools/ahk/AutoHotkey64.exe -ArgumentList '/ErrorStdOut', 'Tests\RunTests.ahk', 'DelayedStartCheck' `
                  -PassThru -NoNewWindow -RedirectStandardOutput check.log -RedirectStandardError check.err
          if (-not $proc.WaitForExit(300000)) { $proc.Kill(); throw "The check didn't finish in 5 minutes" }
          Get-Content check.log, check.err
          if ($proc.ExitCode -ne 0) { throw "$($proc.ExitCode) check(s) failed" }
