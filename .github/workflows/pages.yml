# 生成官网 (site/build.py) 并用 GitHub Pages 发布: https://zhugecaomao.github.io/ALTRun/
# 需要在仓库 Settings -> Pages 里把 Source 设为 "GitHub Actions" (只设一次)。
#
# 什么时候更新:
#   - main 上网站、截图、更新日志、主题列表有变化时
#   - Release 工作流成功后 (新版本号、下载链接、文件大小、更新内容)
#   - 每天一次 (下载次数)
# 网站内容以 site/ 和仓库里的数据为准; 每次部署都会在仓库首页的 Deployments 里留下记录。
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - CHANGELOG.md
      - Src/Core/I18n.ahk
      - Resources/Lang/zh-CN.json
      - Src/UI/ThemeManager.ahk
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 site/build.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
