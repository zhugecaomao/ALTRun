# Builds the website (site/build.py) and publishes it with GitHub Pages: https://zhugecaomao.github.io/ALTRun/
# Needs Source set to "GitHub Actions" in the repository's Settings -> Pages (once).
#
# When it updates:
#   - when the site, screenshots, changelog or theme list change on main
#   - after the Release workflow succeeds (new version, download links, file size, release notes)
#   - once a day (download counts)
# The site's content comes from site/ and the data in the repository; each deployment leaves a record under Deployments on the repository's home page.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - CHANGELOG.md
      - Src/Core/I18n.ahk
      - Resources/Lang/zh-CN.json
      - Src/UI/ThemeManager.ahk
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Release runs are named by the publish input; dry-run builds must not redeploy the site.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.display_title == 'Publish release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 site/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
