# 在 Windows 上自动生成 README / Wiki 用的界面截图 (Tests\Screenshots\TakeScreenshots.ahk),
# 上传为 artifact; 在 main 以外的分支上运行时, 把截图提交回该分支。
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - Tests/Screenshots/**
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2
        shell: pwsh
        run: |
          New-Item -ItemType Directory tools -Force | Out-Null
          $ahkTag = gh release list --repo AutoHotkey/AutoHotkey --limit 30 --exclude-pre-releases --json tagName --jq '[.[].tagName | select(startswith("v2."))][0]'
          if (-not $ahkTag) { throw "No AutoHotkey v2 release found" }
          Write-Host "AutoHotkey $ahkTag"
          gh release download $ahkTag --repo AutoHotkey/AutoHotkey --pattern "AutoHotkey_*.zip" --dir tools
          Expand-Archive (Get-ChildItem tools -Filter "AutoHotkey_*.zip")[0].FullName tools/ahk

      # 文档图标和 Everything (截图里文件搜索的结果), 不用安装软件, 几秒钟:
      #   - .docx / .xlsx / .pptx 等关联到 Tests/Screenshots/Icons 里的 LibreOffice 文档图标 (只写当前用户的注册表;
      #     只在 GitHub 的虚拟机上做, 本地运行截图脚本时不会改你的文件关联)
      #   - Everything 用便携版, 下载后直接运行 (截图的设置里只搜演示文件夹)
      # 做不到时照常截图
      - name: Document icons and Everything
        continue-on-error: true
        shell: pwsh
        run: |
          $icons = (Resolve-Path Tests/Screenshots/Icons).Path
          $types = @{ text = "doc docx docm odt rtf"; spreadsheet = "xls xlsx xlsm csv ods"; presentation = "ppt pptx pptm odp" }
          foreach ($kind in $types.Keys) {
            $progId = "ALTRunShots.$kind"
            New-Item "HKCU:\Software\Classes\$progId\DefaultIcon" -Value "$icons\$kind.ico" -Force | Out-Null
            foreach ($ext in $types[$kind].Split(" ")) { New-Item "HKCU:\Software\Classes\.$ext" -Value $progId -Force | Out-Null }
          }
          Add-Type -Namespace Shots -Name Shell -MemberDefinition '[DllImport("shell32.dll")] public static extern void SHChangeNotify(int e, uint f, IntPtr a, IntPtr b);'
          [Shots.Shell]::SHChangeNotify(0x08000000, 0, [IntPtr]::Zero, [IntPtr]::Zero)   # SHCNE_ASSOCCHANGED: 刷新图标
          Write-Host "Document icons registered from $icons"

          $page = (Invoke-WebRequest https://www.voidtools.com/downloads/ -UseBasicParsing).Content
          $zip = [regex]::Match($page, 'Everything-[\d.]+\.x64\.zip').Value
          if (-not $zip) { Write-Host "Everything download link not found"; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP "Everything"
          Invoke-WebRequest "https://www.voidtools.com/$zip" -OutFile "$dir.zip" -UseBasicParsing
          Expand-Archive "$dir.zip" $dir -Force
          Start-Process (Join-Path $dir "Everything.exe") -ArgumentList "-startup"
          # 等 Everything 建好索引 (EVERYTHING_IPC_IS_DB_LOADED), 最多 90 秒: 没建好时搜索返回空, 文件搜索的截图只剩一行
          $wait = Join-Path $env:RUNNER_TEMP "EverythingWait.ahk"
          Set-Content $wait -Encoding utf8 @'
          #NoTrayIcon
          DetectHiddenWindows(true)
          start := A_TickCount
          loop {
              loaded := 0
              if WinExist("ahk_class EVERYTHING_TASKBAR_NOTIFICATION")
                  try loaded := SendMessage(0x400, 401, 0)                       ; WM_USER, EVERYTHING_IPC_IS_DB_LOADED
              if (loaded || A_TickCount - start > 90000)
                  break
              Sleep(500)
          }
          FileAppend((loaded ? "loaded" : "not loaded") " after " Round((A_TickCount - start) / 1000) " s", "*")
          '@
          $out = Join-Path $env:RUNNER_TEMP "EverythingWait.txt"
          Start-Process tools/ahk/AutoHotkey64.exe -ArgumentList '/ErrorStdOut', "`"$wait`"" -Wait -NoNewWindow -RedirectStandardOutput $out
          Write-Host "$zip database: $(Get-Content $out -Raw)"

      # 1920 x 1080、150% 缩放、灰度字体抗锯齿: 截图更清晰 (做不到时保持 100%)
      - name: Display settings for screenshots
        shell: pwsh
        run: pwsh -NoProfile -File Tests/Screenshots/SetDisplay.ps1 -Ahk tools/ahk/AutoHotkey64.exe

      - name: Take screenshots
        shell: pwsh
        run: pwsh -NoProfile -File Tests/Screenshots/RunShots.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Skip normal-scale

      # 截图加上 Windows 11 那样的圆角 (虚拟机没有显卡加速, 系统不画圆角), README 首页的动图 demo.png (APNG)
      # 由 "demo" 场景存下的帧合成 (圆角、阴影、模糊的背景); 都用 Pillow, 按 SHOT_SCALE 放大圆角和边距
      - name: Rounded corners and demo GIF
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow
          python Tests/Screenshots/RoundCorners.py docs/images/screenshots
          if ($LASTEXITCODE -ne 0) { throw "RoundCorners.py failed" }
          $frames = Join-Path $env:TEMP "ALTRunDemoFrames"
          if (-not (Test-Path (Join-Path $frames "frames.txt"))) { Write-Host "No demo frames"; exit 0 }
          python Tests/Screenshots/MakeDemo.py $frames docs/images/screenshots/demo.png
          if ($LASTEXITCODE -ne 0) { throw "MakeDemo.py failed" }

      # 偏好设置和 Quick Switch (Shots.NormalScale) 在 150% 下太大: 缩放调回 100% 再截一次 (字体用 ClearType), 圆角按 100% 的半径
      # (已经是圆角的图 RoundCorners.py 不再处理)
      - name: Display at 100% for Preferences and Quick Switch
        shell: pwsh
        run: pwsh -NoProfile -File Tests/Screenshots/SetDisplay.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Scale 100

      - name: Take screenshots at 100%
        shell: pwsh
        run: |
          pwsh -NoProfile -File Tests/Screenshots/RunShots.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Only normal-scale
          python Tests/Screenshots/RoundCorners.py docs/images/screenshots
          if ($LASTEXITCODE -ne 0) { throw "RoundCorners.py failed" }

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/images/screenshots

      - name: Commit screenshots to the branch
        if: github.ref_name != 'main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes"; exit 0 }
          git commit -m "Update screenshots"
          git push origin "HEAD:${{ github.ref_name }}"
