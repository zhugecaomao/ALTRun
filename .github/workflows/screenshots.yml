# Makes the UI screenshots for the README / Wiki on Windows (Tests\Screenshots\TakeScreenshots.ahk),
# uploads the changed ones as artifacts (one per group); on branches other than main it commits them back to the branch.
# Run by hand, "scenes" can name only the scenes to shoot (e.g. "prefs-general shellmenu"); empty = all of them.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Scenes to shoot, separated by spaces (empty = all)"
        type: string
        default: ""
  push:
    branches-ignore: [main]
    paths:
      - Tests/Screenshots/**
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  # A push also counts the screenshot script changes that merging main brought in: shoot only when the branch itself changed it
  # (compared with where it left main), so a merge of main doesn't start a full run that only commits pixel noise
  changes:
    runs-on: ubuntu-latest
    outputs:
      shoot: ${{ steps.check.outputs.shoot }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "shoot=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git merge-base origin/main HEAD)
          if git diff --quiet "$base" HEAD -- Tests/Screenshots .github/workflows/screenshots.yml; then
            echo "Only changes from main: no screenshots"; echo "shoot=false" >> "$GITHUB_OUTPUT"
          else
            echo "shoot=true" >> "$GITHUB_OUTPUT"
          fi

  # Three runners in parallel, each with its own display scale: the themes (150%), the other search window scenes (150%) and the
  # Preferences / Quick Switch scenes (100%, Shots.NormalScale). Each scene starts its own ALTRun, so the groups don't depend on each other.
  # Each uploads the screenshots it changed; "commit" puts them together and commits them once
  screenshots:
    needs: changes
    if: needs.changes.outputs.shoot == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: themes                                  # only = the group's scenes, skip = scenes left to the other groups
            scale: 150
            only: themes
            skip: ""
          - group: search
            scale: 150
            only: ""
            skip: "normal-scale themes"
          - group: normal-scale
            scale: 100
            only: normal-scale
            skip: ""
    env:
      GH_TOKEN: ${{ github.token }}
      SCENES: ${{ inputs.scenes }}
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2
        shell: pwsh
        run: |
          New-Item -ItemType Directory tools -Force | Out-Null
          $ahkTag = gh release list --repo AutoHotkey/AutoHotkey --limit 30 --exclude-pre-releases --json tagName --jq '[.[].tagName | select(startswith("v2."))][0]'
          if (-not $ahkTag) { throw "No AutoHotkey v2 release found" }
          Write-Host "AutoHotkey $ahkTag"
          gh release download $ahkTag --repo AutoHotkey/AutoHotkey --pattern "AutoHotkey_*.zip" --dir tools
          Expand-Archive (Get-ChildItem tools -Filter "AutoHotkey_*.zip")[0].FullName tools/ahk

      # Windows 11's short context menu has no "Send to": the "sendto" scene (normal-scale group) needs the full one, so the VM is set to always show it
      # (only the current user's registry, only on the GitHub VM; takes effect after Explorer restarts). Screenshots go on as usual if it fails
      - name: Full context menu
        if: matrix.group == 'normal-scale'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item "HKCU:\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32" -Value "" -Force | Out-Null
          Stop-Process -Name explorer -Force
          Start-Sleep -Seconds 5
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe; Start-Sleep -Seconds 5 }
          Write-Host "Explorer restarted with the full context menu"

      # Document icons: .docx / .xlsx / .pptx etc. are associated with the LibreOffice document icons in Tests/Screenshots/Icons, no Office needed
      # (only the current user's registry; only on the GitHub VM, running the screenshot script locally doesn't change your file associations). Screenshots go on as usual if it fails
      - name: Document icons
        continue-on-error: true
        shell: pwsh
        run: |
          $icons = (Resolve-Path Tests/Screenshots/Icons).Path
          $types = @{ text = "doc docx docm odt rtf"; spreadsheet = "xls xlsx xlsm csv ods"; presentation = "ppt pptx pptm odp" }
          foreach ($kind in $types.Keys) {
            $progId = "ALTRunShots.$kind"
            New-Item "HKCU:\Software\Classes\$progId\DefaultIcon" -Value "$icons\$kind.ico" -Force | Out-Null
            foreach ($ext in $types[$kind].Split(" ")) { New-Item "HKCU:\Software\Classes\.$ext" -Value $progId -Force | Out-Null }
          }
          Add-Type -Namespace Shots -Name Shell -MemberDefinition '[DllImport("shell32.dll")] public static extern void SHChangeNotify(int e, uint f, IntPtr a, IntPtr b);'
          [Shots.Shell]::SHChangeNotify(0x08000000, 0, [IntPtr]::Zero, [IntPtr]::Zero)   # SHCNE_ASSOCCHANGED: refresh the icons
          Write-Host "Document icons registered from $icons"

      # 1920 x 1080; 150% (grayscale font smoothing: sharper screenshots) or 100% for Preferences and Quick Switch, which are too big at 150%
      # (ClearType). Stays at 100% if it fails; SHOT_SCALE tells RoundCorners.py / MakeDemo.py the scale
      - name: Display settings for screenshots
        shell: pwsh
        run: pwsh -NoProfile -File Tests/Screenshots/SetDisplay.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Scale ${{ matrix.scale }}

      # With "scenes" given: those of them that belong to this group
      - name: Take screenshots
        shell: pwsh
        run: |
          $scenes = @(-split $env:SCENES); $only = @(-split "${{ matrix.only }}"); $skip = @(-split "${{ matrix.skip }}")
          if ($scenes.Count) { $within = $only; $only = $scenes } else { $within = @() }
          & Tests/Screenshots/RunShots.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Only $only -Skip $skip -Within $within   # & so the lists bind as arrays

      # Screenshots get Windows 11-style rounded corners (the VM has no GPU acceleration, so the system draws none); the animations (APNG: demo.png on the README
      # front page, demo-*.png for the features) are assembled from the frames the "demo" scenes saved (rounded corners, shadow, blurred background);
      # all with Pillow, corners and margins scaled by SHOT_SCALE (RoundCorners.py leaves images that already have rounded corners alone)
      - name: Rounded corners and animations
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow
          python Tests/Screenshots/RoundCorners.py docs/images/screenshots
          if ($LASTEXITCODE -ne 0) { throw "RoundCorners.py failed" }
          pwsh -NoProfile -File Tests/Screenshots/MakeDemos.ps1

      # Only the screenshots this group changed or added
      - name: Collect the changed screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots-out -Force | Out-Null
          Set-Content shots-out/group.txt $env:GROUP                          # the artifact is never empty (download-artifact then finds every group)
          $changed = @(git status --porcelain --untracked-files=all -- docs/images/screenshots | ForEach-Object { $_.Substring(3).Trim('"') })
          foreach ($file in $changed) { Copy-Item $file shots-out/ }
          Write-Host "$($changed.Count) changed screenshot(s) in the $env:GROUP group"
        env:
          GROUP: ${{ matrix.group }}

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.group }}
          path: shots-out

  # All groups done without failures: put the changed screenshots together and commit them to the branch once
  commit:
    needs: screenshots
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: screenshots-*
          path: shots
          merge-multiple: true

      - name: Commit screenshots to the branch
        shell: bash
        run: |
          cp shots/*.png docs/images/screenshots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update screenshots"
          git push origin "HEAD:${{ github.ref_name }}"
