# Every PR and commit on main: unit tests and /validate (syntax check + #Warn warnings) on Windows
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20                                    # a normal run takes about 2 minutes; the steps have their own limits (Tests/Tools/RunAhk.ps1)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2
        shell: pwsh
        run: |
          New-Item -ItemType Directory tools -Force | Out-Null
          $ahkTag = gh release list --repo AutoHotkey/AutoHotkey --limit 30 --exclude-pre-releases --json tagName --jq '[.[].tagName | select(startswith("v2."))][0]'
          if (-not $ahkTag) { throw "No AutoHotkey v2 release found" }
          Write-Host "AutoHotkey $ahkTag"
          gh release download $ahkTag --repo AutoHotkey/AutoHotkey --pattern "AutoHotkey_*.zip" --dir tools
          Expand-Archive (Get-ChildItem tools -Filter "AutoHotkey_*.zip")[0].FullName tools/ahk

      # The steps below stop a script that hangs (a dialog nobody closes) and print the dialog's text (Tests/Tools/RunAhk.ps1).
      # Checked here with a script that is stuck on a message box: stopped after 5 s, its text printed, exit code 124
      - name: Check the time limit
        shell: pwsh
        run: |
          Set-Content "$env:RUNNER_TEMP\hang.ahk" "MsgBox('Time limit check: stuck on this dialog')" -Encoding utf8BOM
          $text = & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', "$env:RUNNER_TEMP\hang.ahk" `
                  -Out hang.log -Err hang.err -TimeoutSeconds 5 -NoAnnotation 6>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $text
          if ($code -ne 124 -or $text -notmatch 'stuck on this dialog') { throw "The time limit didn't work (exit code $code)" }
          $global:LASTEXITCODE = 0                                  # 124 was expected; Actions would fail the step on the last exit code

      - name: Validate (syntax and warnings)
        shell: pwsh
        run: |
          # #Warn warnings go to stdout, and any output counts as a failure
          (Get-Content ALTRun.ahk -Raw) -replace '#Warn All, OutputDebug', '#Warn All, StdOut' | Set-Content _validate.ahk -Encoding utf8BOM
          & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', '/validate', '_validate.ahk' `
            -Out validate.log -Err validate.err -TimeoutSeconds 120
          $code = $LASTEXITCODE
          $output = (Get-Content validate.log, validate.err -Raw) -join ""
          Write-Host $output
          if ($code -ne 0 -or $output.Trim()) { throw "Validation failed (exit code $code)" }

      # A value with a method's name (static _tick := ... next to _Tick()) stops ALTRun on a dialog while the class is set up,
      # before the unit tests could report it; /validate and #Warn don't see it (Tests/Tools/NameCheck.ahk)
      - name: Check names (values that overwrite a method)
        shell: pwsh
        run: |
          & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', 'Tests\Tools\NameCheck.ahk' `
            -Out names.log -Err names.err -TimeoutSeconds 120
          $code = $LASTEXITCODE
          $output = (Get-Content names.log, names.err -Raw) -join ""
          Write-Host $output
          Get-Content names.log | Where-Object { $_.Trim() } | ForEach-Object { Write-Host "::error::$_" }
          if ($code -ne 0 -or $output.Trim()) { throw "Name check failed (exit code $code)" }

      # The benchmark and screenshot scripts run unattended in other workflows: a load-time warning there would wait for a dialog
      # nobody closes (an undefined class from a Lib file they didn't include hung both runs once). Both send warnings to stdout
      - name: Validate the benchmark, screenshot and standalone integration check scripts
        shell: pwsh
        run: |
          foreach ($script in "Tests\Bench\BenchDriver.ahk", "Tests\Screenshots\TakeScreenshots.ahk", "Tests\Integration\EverythingCheck.ahk", "Tests\Integration\QuickSwitchCheck.ahk", "Tests\Integration\ExplorerTabsCheck.ahk", "Tests\Integration\BrowserHistoryCheck.ahk") {
            & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', '/validate', $script `
              -Out validate.log -Err validate.err -TimeoutSeconds 120
            $code = $LASTEXITCODE
            $output = (Get-Content validate.log, validate.err -Raw) -join ""
            Write-Host "${script}: $output"
            if ($code -ne 0 -or $output.Trim()) { throw "Validation of $script failed (exit code $code)" }
          }

      - name: Unit tests
        shell: pwsh
        run: |
          & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', 'Tests\RunTests.ahk' `
            -Out test.log -Err test.err -TimeoutSeconds 600                 # about 70 s on GitHub's runners
          $code = $LASTEXITCODE
          Get-Content test.log | Where-Object { $_ -notmatch '^PASS' }
          Get-Content test.log | Where-Object { $_ -match '^(FAIL|UNCAUGHT)' } | ForEach-Object { Write-Host "::error::$_" }   # failed tests show in the annotations of the check results
          Get-Content test.err
          if ($code -ne 0) { throw "Unit tests failed (exit code $code)" }
