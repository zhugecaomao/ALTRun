# Every PR and commit on main: unit tests and /validate (syntax check + #Warn warnings) on Windows; on Mondays also with the newest AutoHotkey v2 release
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7 2 * * 1'                                                   # Mondays 02:07 UTC: the tests on the newest AutoHotkey v2 release (.github/actions/setup-ahk)
  workflow_dispatch:

permissions:
  contents: read

concurrency:                                                            # a new commit on a PR stops the run for the old one; on main every commit keeps its run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20                                    # a normal run takes about 2 minutes; the steps have their own limits (Tests/Tools/RunAhk.ps1)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2                                      # pinned (.github/actions/setup-ahk); the weekly run tries the newest release
        uses: ./.github/actions/setup-ahk
        with:
          latest: ${{ github.event_name == 'schedule' }}

      # The steps below stop a script that hangs (a dialog nobody closes) and print the dialog's text (Tests/Tools/RunAhk.ps1).
      # Checked here with a script that is stuck on a message box: stopped after 5 s, its text printed, exit code 124
      - name: Check the time limit
        shell: pwsh
        run: |
          Set-Content "$env:RUNNER_TEMP\hang.ahk" "MsgBox('Time limit check: stuck on this dialog')" -Encoding utf8BOM
          $text = & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', "$env:RUNNER_TEMP\hang.ahk" `
                  -Out hang.log -Err hang.err -TimeoutSeconds 5 -NoAnnotation 6>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $text
          if ($code -ne 124 -or $text -notmatch 'stuck on this dialog') { throw "The time limit didn't work (exit code $code)" }
          $global:LASTEXITCODE = 0                                  # 124 was expected; Actions would fail the step on the last exit code

      - name: Validate (syntax and warnings)
        shell: pwsh
        run: |
          # #Warn warnings go to stdout, and any output counts as a failure
          (Get-Content ALTRun.ahk -Raw) -replace '#Warn All, OutputDebug', '#Warn All, StdOut' | Set-Content _validate.ahk -Encoding utf8BOM
          & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', '/validate', '_validate.ahk' `
            -Out validate.log -Err validate.err -TimeoutSeconds 120
          $code = $LASTEXITCODE
          $output = (Get-Content validate.log, validate.err -Raw) -join ""
          Write-Host $output
          if ($code -ne 0 -or $output.Trim()) { throw "Validation failed (exit code $code)" }

      # A value with a method's name (static _tick := ... next to _Tick()) stops ALTRun on a dialog while the class is set up,
      # before the unit tests could report it; /validate and #Warn don't see it (Tests/Tools/NameCheck.ahk)
      - name: Check names (values that overwrite a method)
        shell: pwsh
        run: |
          & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', 'Tests\Tools\NameCheck.ahk' `
            -Out names.log -Err names.err -TimeoutSeconds 120
          $code = $LASTEXITCODE
          $output = (Get-Content names.log, names.err -Raw) -join ""
          Write-Host $output
          Get-Content names.log | Where-Object { $_.Trim() } | ForEach-Object { Write-Host "::error::$_" }
          if ($code -ne 0 -or $output.Trim()) { throw "Name check failed (exit code $code)" }

      # The benchmark and screenshot scripts run unattended in other workflows: a load-time warning there would wait for a dialog
      # nobody closes (an undefined class from a Lib file they didn't include hung both runs once). Both send warnings to stdout
      - name: Validate the benchmark, screenshot and standalone integration check scripts
        shell: pwsh
        run: |
          foreach ($script in "Tests\Bench\BenchDriver.ahk", "Tests\Screenshots\TakeScreenshots.ahk", "Tests\Integration\EverythingCheck.ahk", "Tests\Integration\QuickSwitchCheck.ahk", "Tests\Integration\ExplorerTabsCheck.ahk", "Tests\Integration\BrowserHistoryCheck.ahk", "Tests\Integration\HotkeyCheck.ahk", "Tests\Integration\FirstRunCheck.ahk") {
            & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', '/validate', $script `
              -Out validate.log -Err validate.err -TimeoutSeconds 120
            $code = $LASTEXITCODE
            $output = (Get-Content validate.log, validate.err -Raw) -join ""
            Write-Host "${script}: $output"
            if ($code -ne 0 -or $output.Trim()) { throw "Validation of $script failed (exit code $code)" }
          }

      - name: Validate the script library (docs/scripts; its headers are checked by ProjectTests.ScriptLibrary)
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem docs\scripts\*.ahk) {
            # quoted: Start-Process joins the arguments with spaces, and "TC Commands.ahk" has one
            & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', '/validate', "`"$($script.FullName)`"" `
              -Out validate.log -Err validate.err -TimeoutSeconds 120
            $code = $LASTEXITCODE
            $output = (Get-Content validate.log, validate.err -Raw) -join ""
            Write-Host "$($script.Name): $output"
            if ($code -ne 0 -or $output.Trim()) { throw "Validation of $($script.Name) failed (exit code $code)" }
          }
          foreach ($script in Get-ChildItem docs\scripts\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            Write-Host "$($script.Name): $($errors.Count) parse errors"
            if ($errors) { $errors | ForEach-Object { Write-Host "::error::$($script.Name): $_" }; throw "Parsing $($script.Name) failed" }
            # Windows PowerShell 5 reads a file without a byte order mark as ANSI: non-ASCII text needs one
            $bytes = [IO.File]::ReadAllBytes($script.FullName)
            $bom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if (-not $bom -and ($bytes | Where-Object { $_ -gt 127 })) { throw "$($script.Name) has non-ASCII text but no UTF-8 byte order mark" }
          }
      - name: Run the library's batch script under a Chinese code page (its Chinese text is on rem lines only)
        shell: cmd
        run: |
          chcp 936 >nul
          echo.| call "docs\scripts\Who Uses a Port.bat" 135 > port.log 2>&1
          type port.log
          findstr /c:":135 " port.log >nul || (echo ::error::Who Uses a Port.bat didn't list port 135 & exit /b 1)
      - name: Run the library's live results and background scripts with sample input (what they print, as ALTRun reads it)
        shell: pwsh
        run: |
          function Invoke-Library([string]$name, [string]$arg, [hashtable]$vars = @{}) {
            foreach ($key in $vars.Keys) { Set-Item "env:$key" $vars[$key] }
            & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Out run.log -Err run.err -TimeoutSeconds 60 `
              -Arguments '/ErrorStdOut', "`"$((Resolve-Path "docs\scripts\$name").Path)`"", "`"$($arg -replace '"', '\"')`""   # \" : a quote inside the argument
            $code = $LASTEXITCODE
            foreach ($key in $vars.Keys) { Remove-Item "env:$key" }
            $out = "$(Get-Content run.log -Raw -Encoding utf8)"; $err = "$(Get-Content run.err -Raw -Encoding utf8)"
            Write-Host "--- $name [$arg] exit $code`n$out$err"
            if ($code -ne 0) { throw "$name [$arg] ended with exit code $code" }
            return $out
          }
          function Get-Items([string]$out, [string]$name, [int]$least) {
            $items = @(($out | ConvertFrom-Json).items)
            if ($items.Count -lt $least) { throw "$name listed $($items.Count) results, at least $least expected" }
            if ($items | Where-Object { -not $_.title }) { throw "$name printed a result without a title" }
            return $items
          }
          # Unix Timestamp: now, a timestamp in seconds, a date that doesn't exist
          $items = Get-Items (Invoke-Library 'Unix Timestamp.ahk' '') 'Unix Timestamp' 3
          if ($items[0].title -notmatch '^\d{10}$') { throw "Unix Timestamp: now isn't 10 digits: $($items[0].title)" }
          $items = Get-Items (Invoke-Library 'Unix Timestamp.ahk' '1794933000') 'Unix Timestamp' 3
          if ($items[1].title -ne '2026-11-17 08:30:00 UTC') { throw "Unix Timestamp: 1794933000 is $($items[1].title)" }
          $items = Get-Items (Invoke-Library 'Unix Timestamp.ahk' '2026-02-30') 'Unix Timestamp' 1
          if ($items[0].valid -ne $false) { throw "Unix Timestamp: 2026-02-30 wasn't refused" }
          # World Clock: every city found in Windows' time zones; Tokyo has no summer time
          $items = Get-Items (Invoke-Library 'World Clock.ahk' '') 'World Clock' 60
          $tokyo = $items | Where-Object { $_.uid -eq 'Tokyo' }
          if ($tokyo.subtitle -notmatch 'UTC\+9 ') { throw "World Clock: Tokyo is $($tokyo.subtitle)" }
          # Kill Process: lists programs; ends a ping started here
          $null = Get-Items (Invoke-Library 'Kill Process.ahk' '') 'Kill Process' 1
          $ping = Start-Process ping.exe -ArgumentList '-n', '120', '127.0.0.1' -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 1
          $items = Get-Items (Invoke-Library 'Kill Process.ahk' '') 'Kill Process' 2
          if (-not ($items | Where-Object { $_.arg -eq 'PING.EXE' -and $_.type -eq 'script' })) { throw "Kill Process didn't list PING.EXE" }
          $out = Invoke-Library 'Kill Process.ahk' 'PING.EXE' @{ ALTRUN_ACTION = 'run' }
          Start-Sleep -Milliseconds 500
          if (-not $ping.HasExited -or $out -notmatch '^Ended PING.EXE') { throw "Kill Process didn't end ping: $out" }
          # Quick Note: Chinese text and quotes reach the file as they were typed
          $notes = Join-Path $env:RUNNER_TEMP 'Notes.md'
          $out = Invoke-Library 'Quick Note.ahk' '给客户回电 "tomorrow"' @{ QUICKNOTE_FILE = $notes }
          $line = Get-Content $notes -Encoding utf8
          if ($line -notmatch '^- \d{4}-\d\d-\d\d \d\d:\d\d 给客户回电 "tomorrow"$') { throw "Quick Note wrote: $line" }
          # Dark Mode: sets the mode it is given, switches without one (on this runner only)
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          $null = Invoke-Library 'Dark Mode.ahk' 'dark'
          if ((Get-ItemProperty $key).AppsUseLightTheme -ne 0) { throw "Dark Mode: still light" }
          $null = Invoke-Library 'Dark Mode.ahk' ''
          if ((Get-ItemProperty $key).AppsUseLightTheme -ne 1 -or (Get-ItemProperty $key).SystemUsesLightTheme -ne 1) { throw "Dark Mode: didn't switch back to light" }
      - name: Unit tests
        shell: pwsh
        run: |
          & Tests/Tools/RunAhk.ps1 -Ahk tools/ahk/AutoHotkey64.exe -Arguments '/ErrorStdOut', 'Tests\RunTests.ahk' `
            -Out test.log -Err test.err -TimeoutSeconds 600                 # about 70 s on GitHub's runners
          $code = $LASTEXITCODE
          Get-Content test.log | Where-Object { $_ -notmatch '^PASS' }
          Get-Content test.log | Where-Object { $_ -match '^(FAIL|UNCAUGHT)' } | ForEach-Object { Write-Host "::error::$_" }   # failed tests show in the annotations of the check results
          Get-Content test.err
          if ($code -ne 0) { throw "Unit tests failed (exit code $code)" }
