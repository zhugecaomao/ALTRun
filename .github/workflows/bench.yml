# Simulates daily use on Windows to compare the performance of two versions (Tests/Bench/BenchDriver.ahk); results go to the run summary, raw data is an artifact.
#   Run manually (Actions → Bench → Run workflow): baseline defaults to the latest release, candidate to the branch it runs on;
#   2 rounds per version x (searches searches + others of each action), default 500 / 100 (1000 searches + 200 of each per version)
#   The work is split over several runners at the same time (runners, default 4: about 17 minutes instead of 50 on one). Each runs
#   both versions alternating (A B B A, or B A A B on even runners) with its share of the operations, so the two are always compared
#   on the same machine; the summary job pools the results and shows the candidate / baseline ratio on each runner (they should agree)
#   When the test scripts change on a branch other than main: a short run with few iterations on 2 runners (smoke test, about 7 minutes)
name: Bench

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline: tag / branch / commit (empty = latest release)"
        required: false
        default: ""
      candidate:
        description: "Candidate: tag / branch / commit (empty = the branch this runs on)"
        required: false
        default: ""
      searches:
        description: "Searches per round (2 rounds per version)"
        required: false
        default: "500"
      others:
        description: "Each other operation per round"
        required: false
        default: "100"
      runners:
        description: "Runners sharing the work (each runs both versions, A B B A)"
        required: false
        default: "4"
  push:
    branches-ignore: [main]
    paths:
      - Tests/Bench/**
      - .github/workflows/bench.yml

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.plan.outputs.runners }}
    steps:
      - id: plan
        env:
          RUNNERS: ${{ inputs.runners || '2' }}
        run: |
          n=$(( RUNNERS < 1 ? 1 : (RUNNERS > 10 ? 10 : RUNNERS) ))
          echo "runners=[$(seq -s, 1 $n)]" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE: ${{ inputs.baseline }}
      CANDIDATE: ${{ inputs.candidate }}
      SEARCHES: ${{ inputs.searches || '20' }}
      OTHERS: ${{ inputs.others || '4' }}
      RUNNER_NO: ${{ matrix.runner }}
      RUNNER_COUNT: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download AutoHotkey v2
        shell: pwsh
        run: |
          New-Item -ItemType Directory tools -Force | Out-Null
          # Keep the interpreter fixed so baseline/candidate benchmark results are comparable.
          $ahkTag = 'v2.0.31'
          gh release download $ahkTag --repo AutoHotkey/AutoHotkey --pattern "AutoHotkey_*.zip" --dir tools
          Expand-Archive (Get-ChildItem tools -Filter "AutoHotkey_*.zip")[0].FullName tools/ahk

      - name: Prepare
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $baseline = if ($env:BASELINE) { $env:BASELINE } else { gh api repos/${{ github.repository }}/releases/latest --jq .tag_name }
          git worktree add v-baseline $baseline | Out-Null
          if ($env:CANDIDATE) { git worktree add v-candidate $env:CANDIDATE | Out-Null; $candidateDir = "$root\v-candidate" } else { $candidateDir = $root }
          foreach ($v in @(@{name = "baseline"; src = "$root\v-baseline"}, @{name = "candidate"; src = $candidateDir})) {
            $app = "C:\Bench\$($v.name)"
            New-Item -ItemType Directory $app -Force | Out-Null
            Copy-Item "$($v.src)\ALTRun.ahk" $app
            foreach ($d in "Lib", "Src", "Resources") { Copy-Item "$($v.src)\$d" $app -Recurse }
            Copy-Item "$root\Tests\Bench\BenchProbe.ahk" $app
            $text = (Get-Content "$app\ALTRun.ahk" -Raw).TrimEnd() -replace 'App\.Start\(\)$', "#Include BenchProbe.ahk`r`nApp.Start()"
            Set-Content "$app\ALTRun.ahk" $text -Encoding utf8BOM
            if (-not (Select-String -Path "$app\ALTRun.ahk" -Pattern 'BenchProbe' -Quiet)) { throw "probe not included in $app" }
            $version = (Select-String -Path "$app\Src\Core\App.ahk" -Pattern 'static Version := "([^"]+)"').Matches[0].Groups[1].Value
            "$($v.name)=$version" | Add-Content versions.txt
            Write-Host "$($v.name): $version"
          }
          Remove-Item "$env:LOCALAPPDATA\ALTRun" -Recurse -Force -ErrorAction SilentlyContinue
          $ahk = "$root\tools\ahk\AutoHotkey64.exe"
          & $ahk "$root\Tests\Bench\BenchDriver.ahk" demo | Out-Null
          foreach ($n in "baseline", "candidate") { & $ahk "$root\Tests\Bench\BenchDriver.ahk" prepare "C:\Bench\$n" | Out-Null }

      - name: Benchmark
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $ahk = "$root\tools\ahk\AutoHotkey64.exe"
          $out = "$root\bench-$env:RUNNER_NO.txt"
          # this runner's share of the operations (the first runners take the remainder)
          $n = [int]$env:RUNNER_COUNT; $i = [int]$env:RUNNER_NO
          $share = { param($total) [math]::Floor([int]$total / $n) + $(if ($i -le [int]$total % $n) { 1 } else { 0 }) }
          $searches = & $share $env:SEARCHES; $others = & $share $env:OTHERS
          Write-Host "runner $i of $n`: $searches searches, $others of each other operation per round"
          # the two versions alternate, ALTRun restarted each round, one random seed per pair (different on each runner); odd runners
          # A B B A, even ones B A A B, so each version gets the first and last rounds as often (the first round on a fresh machine
          # differs: first-time caches, Windows still busy). The label is <version>-r<round>s<runner>
          $base = 100 * ($i - 1)
          $first, $second = if ($i % 2) { "baseline", "candidate" } else { "candidate", "baseline" }
          $rounds = @(@($first, 1, ($base + 11)), @($second, 1, ($base + 11)), @($second, 2, ($base + 22)), @($first, 2, ($base + 22)))
          foreach ($r in $rounds) {
            $label = "$($r[0])-r$($r[1])s$i"
            Write-Host "== $label $(Get-Date -Format HH:mm:ss)"
            $p = Start-Process $ahk -ArgumentList @("`"$root\Tests\Bench\BenchDriver.ahk`"", "round", $label, "`"C:\Bench\$($r[0])`"", "`"$out`"", $r[2], $searches, $others) -PassThru
            if (-not $p.WaitForExit(55 * 60 * 1000)) { $p.Kill(); Add-Content $out "$label|fatal|timeout" }
            Get-Process AutoHotkey64 -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 5
          }
          if (Test-Path "$env:TEMP\BenchDriverErrors.txt") { Write-Host "driver errors:"; Get-Content "$env:TEMP\BenchDriverErrors.txt" | Select-Object -First 30 }
          python "$root\Tests\Bench\bench_stats.py" $out                  # this runner's results in its log; the summary job pools them
          "runner $i`: $((Get-CimInstance Win32_OperatingSystem).Caption) $([Environment]::OSVersion.Version), CPU: $((Get-CimInstance Win32_Processor).Name.Trim())" | Set-Content "machine-$i.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.runner }}
          path: |
            bench-${{ matrix.runner }}.txt
            machine-${{ matrix.runner }}.txt
            versions.txt

  summary:
    needs: bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SEARCHES: ${{ inputs.searches || '20' }}
      OTHERS: ${{ inputs.others || '4' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Tests/Bench

      - uses: actions/download-artifact@v7
        with:
          pattern: bench-*
          path: results
          merge-multiple: true

      - name: Summarize
        run: |
          sed -i 's/\r$//' results/*.txt                                   # written on Windows
          cat results/bench-*.txt > bench.txt
          summary=$(python3 Tests/Bench/bench_stats.py bench.txt)
          echo "$summary"
          {
            echo "## ALTRun benchmark"
            echo
            paste -sd, results/versions.txt | sed 's/,/, /g'
            echo
            echo "Searches / other operations per round: $SEARCHES / $OTHERS (2 rounds per version), split over $(ls results/bench-*.txt | wc -l) runners"
            echo
            echo "$summary" | grep -v '^::'
            echo
            cat results/machine-*.txt | sed 's/$/  /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" | grep '^::' || true                           # annotations (e.g. idle CPU over budget)
          cp bench.txt results/

      - uses: actions/upload-artifact@v7
        with:
          name: bench
          path: results
