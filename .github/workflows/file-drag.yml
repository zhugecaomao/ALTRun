# Dragging a file / folder result out of the search window with the real mouse on a Windows desktop (Tests\Integration\FileDragCheck.ahk):
# drag to an Explorer window copies (never moves) and hides the window, Esc cancels. On pull requests that change these, on main, or run by hand
name: File Drag

on:
  pull_request:
    paths:
      - Lib/FileDrag.ahk
      - Src/UI/SearchWindow.ahk
      - Tests/Integration/FileDragCheck.ahk
      - .github/workflows/file-drag.yml
      - .github/actions/setup-ahk/**
  push:
    branches: [main]
    paths:
      - Lib/FileDrag.ahk
      - Src/UI/SearchWindow.ahk
      - Tests/Integration/FileDragCheck.ahk
      - .github/workflows/file-drag.yml
      - .github/actions/setup-ahk/**
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds for each case"
        type: number
        default: 3

permissions:
  contents: read

concurrency:                                                            # a new commit on a PR stops the run for the old one; on main every commit keeps its run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download AutoHotkey v2                                      # pinned, the same as the release build (.github/actions/setup-ahk)
        uses: ./.github/actions/setup-ahk

      - name: Drag and drop
        shell: pwsh
        run: |
          # A copy of its own: the check writes the copy's Data\ALTRun.json
          $app = "C:\FileDragCheck\app"
          New-Item -ItemType Directory $app -Force | Out-Null
          Copy-Item ALTRun.ahk, Lib, Src, Resources -Destination $app -Recurse
          $rounds = "${{ inputs.rounds }}"
          if (-not $rounds) { $rounds = 3 }
          $proc = Start-Process tools/ahk/AutoHotkey64.exe -ArgumentList '/ErrorStdOut', 'Tests\Integration\FileDragCheck.ahk', "`"$app`"", $rounds `
                  -PassThru -NoNewWindow -RedirectStandardOutput check.log -RedirectStandardError check.err
          if (-not $proc.WaitForExit(300000)) { $proc.Kill(); Get-Content check.log, check.err -ErrorAction SilentlyContinue; throw "The check didn't finish in 5 minutes" }
          Get-Content check.log, check.err -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "$($proc.ExitCode) round(s) failed" }
